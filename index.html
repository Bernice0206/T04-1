<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>T04 – SVG House &amp; Garden</title>
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: #eef5f7;
			font-family: Arial, sans-serif;
		}

		svg {
			width: min(800px, 94vw);
			height: auto;
			border: 3px solid #355c5f;
			background: #bfe8f4;
			box-shadow: 0 8px 20px rgba(32, 67, 72, 0.18);
		}
	</style>
</head>
<body>
	<svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-description">
		<title id="scene-title">A house and garden scene</title>
		<desc id="scene-description">A sunny landscape with a cloud, tree, house, fence, and curved garden path.</desc>

		<!-- Sky and grass -->
		<rect x="0" y="0" width="800" height="350" fill="#bfe8f4" />
		<rect x="0" y="350" width="800" height="150" fill="#75b85a" />

		<!-- Sun -->
		<circle cx="680" cy="90" r="48" fill="#ffd45a" stroke="#e7a928" stroke-width="5" />
		<line x1="680" y1="20" x2="680" y2="2" stroke="#e7a928" stroke-width="5" />
		<line x1="680" y1="160" x2="680" y2="178" stroke="#e7a928" stroke-width="5" />
		<line x1="610" y1="90" x2="592" y2="90" stroke="#e7a928" stroke-width="5" />
		<line x1="750" y1="90" x2="768" y2="90" stroke="#e7a928" stroke-width="5" />

		<!-- Cloud -->
		<ellipse cx="170" cy="105" rx="78" ry="30" fill="#ffffff" />
		<circle cx="130" cy="98" r="30" fill="#ffffff" />
		<circle cx="174" cy="82" r="40" fill="#ffffff" />
		<circle cx="218" cy="100" r="28" fill="#ffffff" />

		<!-- Tree -->
		<rect x="92" y="252" width="34" height="120" rx="5" fill="#7c4d2a" />
		<circle cx="108" cy="210" r="65" fill="#3f8c4a" />
		<circle cx="62" cy="235" r="48" fill="#4fa653" />
		<circle cx="154" cy="232" r="48" fill="#4fa653" />

		<!-- House body, roof, and chimney -->
		<rect x="280" y="245" width="270" height="155" fill="#f5c982" stroke="#70452e" stroke-width="5" />
		<polygon points="255,245 415,125 575,245" fill="#b9563e" stroke="#70452e" stroke-width="5" />
		<rect x="475" y="155" width="35" height="75" fill="#80513a" stroke="#70452e" stroke-width="5" />

		<!-- Door and windows -->
		<rect x="385" y="310" width="58" height="90" fill="#6c4939" stroke="#4c3328" stroke-width="4" />
		<circle cx="430" cy="355" r="5" fill="#f6d36f" />
		<rect x="305" y="275" width="55" height="48" fill="#9cdbed" stroke="#4c6670" stroke-width="4" />
		<line x1="332.5" y1="275" x2="332.5" y2="323" stroke="#4c6670" stroke-width="3" />
		<line x1="305" y1="299" x2="360" y2="299" stroke="#4c6670" stroke-width="3" />
		<rect x="475" y="275" width="55" height="48" fill="#9cdbed" stroke="#4c6670" stroke-width="4" />
		<line x1="502.5" y1="275" x2="502.5" y2="323" stroke="#4c6670" stroke-width="3" />
		<line x1="475" y1="299" x2="530" y2="299" stroke="#4c6670" stroke-width="3" />

		<!-- Fence -->
		<polyline points="15,385 15,330 45,350 75,330 105,350 135,330 165,350 195,330 225,350 225,385" fill="none" stroke="#f0dfae" stroke-width="8" stroke-linejoin="round" />
		<line x1="8" y1="365" x2="232" y2="365" stroke="#f0dfae" stroke-width="7" />

		<!-- Curved path -->
		<path d="M 414 400 C 405 425, 350 440, 315 500 L 525 500 C 493 448, 452 426, 443 400 Z" fill="#d6b47c" stroke="#a47c4d" stroke-width="4" />

		<!-- Garden details -->
		<polygon points="610,420 620,395 630,420" fill="#dc6b58" />
		<polygon points="650,435 660,408 670,435" fill="#dc6b58" />
		<line x1="620" y1="420" x2="620" y2="442" stroke="#3e7f42" stroke-width="4" />
		<line x1="660" y1="435" x2="660" y2="457" stroke="#3e7f42" stroke-width="4" />

		<text x="400" y="475" text-anchor="middle" font-size="24" font-weight="bold" fill="#355c5f">Welcome to our house and garden</text>
	</svg>
</body>
</html>
